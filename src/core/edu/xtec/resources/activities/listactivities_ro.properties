# List of currently registered types of JClic activities.
# All JClic Activity classes must extend edu.xtec.jclic.Activity
# and must be accessibles to the JVM classloader.
# List format:
#   full_class_name_including_package=activity_type_name[|activity_type_description]
# The symbol "@" can be used in place of the standard package name: "edu.xtec.jclic.activities."
# Example:
#   com.acme.jclic.TestActivity=Acme test activity|This JClic activity is just a test...

@associations.ComplexAssociation=Asociere complexă|În această activitate există tot două seturi de informații, însă acestea pot avea un număr diferit de elemente și pot exista diferite tipuri de relații între ele, de exemplu: unu-la-unu, mai multe-la-unu, elemente fără corespondență etc.

@associations.SimpleAssociation=Asociere simplă|Există două seturi de informații care au același număr de elemente. Fiecărui element din setul inițial îi corespunde unul și numai unul din setul asociat.

@memory.MemoryGame=Găsește perechile|Fiecare piesă apare de două ori, dar cu fața în jos. La fiecare mutare sunt întoarse două piese, care sunt întoarse la loc dacă nu sunt identice. Scopul este găsirea tuturor perechilor.

@panels.Explore=Activitate de explorare|Este afișat un element inițial de informație și, prin clic pe acesta, este afișată informația asociată fiecărui element.

@panels.Identify=Identifică celulele|Există un singur set de informații și trebuie să faci clic pe acele elemente care îndeplinesc o anumită condiție.

@panels.InformationScreen=Ecran informativ|Este afișat un set de informații și există posibilitatea activării conținutului multimedia pentru fiecare element.

@puzzles.DoublePuzzle=Puzzle dublu|Sunt afișate două panouri. Unul conține informația amestecată, iar celălalt este gol. Obiectul trebuie reconstituit în panoul gol, mutând piesele una câte una.

@puzzles.ExchangePuzzle=Puzzle prin schimbare|Informația este amestecată în cadrul aceluiași panou. La fiecare mutare, două piese își schimbă locul până când obiectul este reordonat.

@puzzles.HolePuzzle=Puzzle cu spațiu liber|În același panou lipsește o piesă, iar celelalte sunt amestecate. La fiecare mutare se deplasează una dintre piesele aflate lângă spațiul liber până când toate revin în ordinea inițială.

@text.WrittenAnswer=Răspuns scris|Este afișat un set de informații, iar textul corespunzător fiecărei părți trebuie scris.

@text.FillInBlanks=Text: Completează spațiile libere|Utilizatorul trebuie să completeze anumite cuvinte, litere sau expresii care au fost ascunse ori mascate într-un text. Soluția fiecărui element poate fi configurată în diferite moduri: scriere într-un spațiu liber, corectarea unei expresii care conține greșeli sau alegerea răspunsului corect dintr-o listă de variante.

@text.Identify=Text: Identifică elementele|Utilizatorul trebuie să identifice prin clic cu mouse-ul anumite cuvinte, litere, numere, simboluri sau semne de punctuație.

@text.Order=Text: Ordonează elementele|La proiectarea acestei activități sunt selectate anumite cuvinte sau paragrafe dintr-un text pentru a fi amestecate. Utilizatorul trebuie să le pună din nou în ordinea corectă.

@text.Complete=Text: Completează textul|Diverse părți ale unui text (litere, cuvinte, semne de punctuație sau expresii) sunt eliminate, iar utilizatorul trebuie să completeze textul.

@textGrid.CrossWord=Integramă|Grila de cuvinte trebuie completată pe baza definițiilor. Definițiile pot fi text, imagini sau sunete. Programul afișează automat definițiile celor două cuvinte care se intersectează în poziția cursorului.

@textGrid.WordSearch=Rebus cu cuvinte ascunse|Cuvintele ascunse trebuie găsite într-o grilă de litere. Celulele neutre din grilă (cele care nu fac parte din niciun cuvânt) sunt completate cu litere alese aleatoriu.