# List of currently registered types of JClic activities.
# All JClic Activity classes must extend edu.xtec.jclic.Activity
# and must be accessibles to the JVM classloader.
# List format:
#   full_class_name_including_package=activity_type_name[|activity_type_description]
# The symbol "@" can be used in place of the standard package name: "edu.xtec.jclic.activities."
# Example:
#   com.acme.jclic.TestActivity=Acme test activity|This JClic activity is just a test...

@associations.ComplexAssociation=Asociere complexa|In aceasta activitate exista tot doua seturi de informatii, insa acestea pot avea un numar diferit de elemente si pot exista diferite tipuri de relatii intre ele, de exemplu: unu-la-unu, mai multe-la-unu, elemente fara corespondenta etc.

@associations.SimpleAssociation=Asociere simpla|Exista doua seturi de informatii care au acelasi numar de elemente. Fiecarui element din setul initial ii corespunde unul si numai unul din setul asociat.

@memory.MemoryGame=Gaseste perechile|Fiecare piesa apare de doua ori, dar cu fata in jos. La fiecare mutare sunt intoarse doua piese, care sunt intoarse la loc daca nu sunt identice. Scopul este gasirea tuturor perechilor.

@panels.Explore=Activitate de explorare|Este afisat un element initial de informatie si, prin clic pe acesta, este afisata informatia asociata fiecarui element.

@panels.Identify=Identifica celulele|Exista un singur set de informatii si trebuie sa faci clic pe acele elemente care indeplinesc o anumita conditie.

@panels.InformationScreen=Ecran informativ|Este afisat un set de informatii si exista posibilitatea activarii continutului multimedia pentru fiecare element.

@puzzles.DoublePuzzle=Puzzle dublu|Sunt afisate doua panouri. Unul contine informatia amestecata, iar celalalt este gol. Obiectul trebuie reconstituit in panoul gol, mutand piesele una cate una.

@puzzles.ExchangePuzzle=Puzzle prin schimbare|Informatia este amestecata in cadrul aceluiasi panou. La fiecare mutare, doua piese isi schimba locul pana cand obiectul este reordonat.

@puzzles.HolePuzzle=Puzzle cu spatiu liber|In acelasi panou lipseste o piesa, iar celelalte sunt amestecate. La fiecare mutare se deplaseaza una dintre piesele aflate langa spatiul liber pana cand toate revin in ordinea initiala.

@text.WrittenAnswer=Raspuns scris|Este afisat un set de informatii, iar textul corespunzator fiecarei parti trebuie scris.

@text.FillInBlanks=Text: Completeaza spatiile libere|Utilizatorul trebuie sa completeze anumite cuvinte, litere sau expresii care au fost ascunse ori mascate intr-un text. Solutia fiecarui element poate fi configurata in diferite moduri: scriere intr-un spatiu liber, corectarea unei expresii care contine greseli sau alegerea raspunsului corect dintr-o lista de variante.

@text.Identify=Text: Identifica elementele|Utilizatorul trebuie sa identifice prin clic cu mouse-ul anumite cuvinte, litere, numere, simboluri sau semne de punctuatie.

@text.Order=Text: Ordoneaza elementele|La proiectarea acestei activitati sunt selectate anumite cuvinte sau paragrafe dintr-un text pentru a fi amestecate. Utilizatorul trebuie sa le puna din nou in ordinea corecta.

@text.Complete=Text: Completeaza textul|Diverse parti ale unui text (litere, cuvinte, semne de punctuatie sau expresii) sunt eliminate, iar utilizatorul trebuie sa completeze textul.

@textGrid.CrossWord=Integrama|Grila de cuvinte trebuie completata pe baza definitiilor. Definitiile pot fi text, imagini sau sunete. Programul afiseaza automat definitiile celor doua cuvinte care se intersecteaza in pozitia cursorului.

@textGrid.WordSearch=Rebus cu cuvinte ascunse|Cuvintele ascunse trebuie gasite intr-o grila de litere. Celulele neutre din grila (cele care nu fac parte din niciun cuvant) sunt completate cu litere alese aleatoriu.